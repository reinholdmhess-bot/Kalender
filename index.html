<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Kalender — Tagesansicht</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <header class="top">
    <button id="prev">◀</button>
    <h1 id="monthTitle">Monat</h1>
    <button id="next">▶</button>
    <span id="mobileDateTrigger" title="Zu Datum springen">📅</span>
    <input type="date" id="jumpToDate" title="Zu Datum springen">
    <button id="today">Heute</button>
    <button id="addEvent">Termin hinzufügen</button>
    <div id="syncStatus" style="font-size: 0.85rem; color: #999; padding: 0 8px;">◕ Verbinde...</div>
  </header>

  <main id="calendar">
    <section id="monthList" class="month-list" aria-label="Monatsliste">
      <div id="monthsContainer" style="display: flex; flex-direction: column;"></div>
    </section>
    <aside id="dayPanel" class="day-panel">
      <div id="dayPanelTools" style="margin-bottom: 10px; display: flex; gap: 8px;">
        <button id="exportBtn" style="flex:1;">Exportieren</button>
        <button id="importBtn" style="flex:1;">Importieren</button>
        <input type="file" id="importFile" accept=".json" style="display:none;">
      </div>
      <ul id="dayEvents"></ul>
    </aside>
  </main>

  <div id="eventModal" class="modal hidden" role="dialog" aria-modal="true">
    <form id="eventForm" class="modal-content">
      <h3 id="modalTitle">Neuer Termin</h3>
      <label>Titel <input name="title" required></label>
      <label>Datum <input name="date" type="date" required></label>
      <label>Uhrzeit <input name="time" type="time"></label>
      <label>Wiederholen
        <select name="repeat">
          <option value="none">Einmalig</option>
          <option value="yearly">Jährlich</option>
        </select>
      </label>
      <label>Geburtstag (Geburtsjahr) <input name="birthYear" type="number" min="1900" max="2100" placeholder="z.B. 1985"></label>
      <label>Beschreibung <textarea name="desc"></textarea></label>
      <div class="actions">
        <button type="submit">Speichern</button>
        <button type="button" id="cancel">Abbrechen</button>
      </div>
    </form>
  </div>

  <div id="contextMenu" class="context-menu hidden" style="position: fixed; background: white; border: 1px solid #ccc; border-radius: 4px; box-shadow: 0 2px 8px rgba(0,0,0,0.15); z-index: 1001; min-width: 120px;">
    <div id="editMenuOption" style="padding: 8px 12px; cursor: pointer; color: #0891b2;">
      Bearbeiten
    </div>
    <div id="deleteMenuOption" style="padding: 8px 12px; cursor: pointer; color: #e11d48;">
      Löschen
    </div>
  </div>

  <script type="module" src="app.js?v=fresh-20250626"></script>
</body>
</html>
